{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="mb-3"><h1 class="h3">{{ titulo }}</h1></div>
<div class="card" style="max-width: 720px"><div class="card-body">
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a class="btn btn-outline-secondary" href="{% url 'contas:usuarios' %}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
