{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1"><i class="bi bi-diagram-3"></i> Gestão de Problemas</h1>
        <p class="text-body-secondary small mb-4">Entre com seu usuário e senha.</p>

        {% if form.errors %}
          <div class="alert alert-danger py-2">Usuário ou senha incorretos.</div>
        {% endif %}

        <form method="post" action="{% url 'contas:login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label for="id_username" class="form-label">Usuário</label>
            <input type="text" name="username" id="id_username" class="form-control"
                   value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label for="id_password" class="form-label">Senha</label>
            <input type="password" name="password" id="id_password" class="form-control"
                   autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
